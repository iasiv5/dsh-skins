  <rect x="11.5" y="9.5" width="13" height="17.5" rx="3.2" fill="url(#t)"/>
  <rect x="11.5" y="9.5" width="13" height="17.5" rx="3.2" fill="url(#b)" transform="rotate(30 18 29)"/>
  <defs>
    <linearGradient id="b" x1="11.5" y1="9.5" x2="24.5" y2="27" gradientUnits="userSpaceOnUse">
      <stop stop-color="#69B9FF"/>
      <stop offset="1" stop-color="#324DE2"/>
    </linearGradient>
    <linearGradient id="t" x1="11.5" y1="9.5" x2="24.5" y2="27" gradientUnits="userSpaceOnUse">
